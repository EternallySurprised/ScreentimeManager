# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET CI — Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v4.7.0

      - run: |
          echo "GitVersion determined this is version ${{ steps.version_step.outputs.semVer }}"
        name: Display Version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore /p:VersionPrefix=${{ steps.version_step.outputs.majorMinorPatch }} /p:VersionSuffix=${{ steps.version_step.outputs.tag }}
        
      - name: Build
        run: dotnet build --no-restore -c Release /p:VersionPrefix=${{ steps.version_step.outputs.majorMinorPatch }} /p:VersionSuffix=${{ steps.version_step.outputs.tag }}

      #- name: Run tests
      #  run: dotnet test --no-build -c Release --verbosity normal \
      #    --collect:"XPlat Code Coverage" \
      #    --results-directory ./coverage

      #- name: Upload coverage report
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: coverage-report
      #    path: ./coverage
      
  
